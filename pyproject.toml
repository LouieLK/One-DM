[project]
name = "One-DM"
version = "0.1.0"
description = "One-Shot Diffusion Mimicker for Handwritten Text Generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Gang Dai"}
]

dependencies = [
    # --- Standard Packages ---
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.3",
    "albumentations>=1.3.1",
    "diffusers>=0.25.0",
    "einops>=0.7.0",
    "ema-pytorch>=0.7.0",
    "opencv-python-headless>=4.8.0",
    "kornia>=0.7.0",
    "pytorch-lightning>=2.1.0",
    "pytorch-metric-learning>=2.3.0",
    "scikit-image>=0.21.0",
    "tensorboard>=2.15.0",
    "torchmetrics>=1.2.0",
    "wandb>=0.16.0",
    "lmdb>=1.6.2",
    "tensorboardx>=2.6.2.2",
    "easydict>=1.13",
    "omegaconf",
    "accelerate",

    # --- PyTorch Dependencies (with Platform Markers) ---
    "torch>=2.1.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch>=2.1.0 ; sys_platform != 'linux' and sys_platform != 'win32'",
    
    "torchvision>=0.16.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision>=0.16.0 ; sys_platform != 'linux' and sys_platform != 'win32'",

    "triton ; sys_platform == 'linux' or sys_platform == 'win32'",
    "pytorch-triton ; sys_platform == 'linux' or sys_platform == 'win32'",

    # --- [新增] 手動為 x86_64 添加缺失的 NVIDIA 依賴 ---
"nvidia-cublas-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-cupti-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cufft-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cufile-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-curand-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusolver-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusparse-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cusparselt-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nccl-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nvjitlink-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nvtx-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-nvshmem-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'" # <-- [新增]
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# --- [修改] 解決 'Multiple top-level packages' 錯誤 ---
[tool.setuptools]
# 替換掉 [tool.setuptools.packages.find]
# 明確告訴 setuptools 哪些是您要打包的 Python 套件。
# 請根據您專案中實際包含 `__init__.py` 的資料夾名稱來增刪此列表：
packages = ["utils", "models", "fid_folder", "trainer", "data_loader"] # <-- [範例] 請修改為您專案的實際套件名稱


# 我們使用 cu128 (CUDA 12.8) 來支援 5090
[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-nightly-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-nightly-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
triton = [
  { index = "pytorch-nightly-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorch-triton = [
  { index = "pytorch-nightly-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]